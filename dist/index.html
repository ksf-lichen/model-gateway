<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="康师傅企业模型网关控制台" />
  <title>康师傅 · 企业模型网关</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css?v=20261118b" />
  <link rel="stylesheet" href="./interactions.css?v=20261118b" />
</head>
<body>
  <svg class="svg-defs" aria-hidden="true">
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-cpu" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/><path d="M9 9h6v6H9zM9 2v3m6-3v3M9 19v3m6-3v3M2 9h3m-3 6h3m14-6h3m-3 6h3"/></symbol>
    <symbol id="i-route" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M9 6h3a4 4 0 0 1 4 4v5M6 9v9h9"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.6c0 4.8 3.1 7.8 7.5 9.4 4.4-1.6 7.5-4.6 7.5-9.4V6z"/><path d="m9 12 2 2 4-4"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><path d="M3.5 20v-2a5.5 5.5 0 0 1 11 0v2M16 5.4a3 3 0 0 1 0 5.2M17 14a4.5 4.5 0 0 1 3.5 4.4V20"/></symbol>
    <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 8-8m-3 3 3 3m-6 0 2 2"/></symbol>
    <symbol id="i-log" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M16 3v4h4M8 11h8M8 15h8M8 18h5"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10m5 10V4m6 16v-7m5 7V7"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M4 6h14a2 2 0 0 1 2 2v11H4a2 2 0 0 1-2-2V7a3 3 0 0 1 3-3h11"/><path d="M15 11h7v5h-7a2.5 2.5 0 0 1 0-5Z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16M7 12h10M10 19h4"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-panel" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9 5v14"/><path d="m14 9-3 3 3 3"/></symbol>
    <symbol id="i-panel-open" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9 5v14"/><path d="m12 9 3 3-3 3"/></symbol>
  </svg>

  <div class="app-shell">
    <aside class="sidebar" id="app-sidebar">
      <div class="brand">
        <div class="brand-mark"><span></span><span></span><span></span></div>
        <div class="brand-copy"><strong>康师傅</strong><small>MODEL GATEWAY</small></div>
        <button class="sidebar-toggle" type="button" data-sidebar-toggle="collapse" aria-label="收起为窄栏" title="收起为窄栏（悬停可临时展开）">
          <svg aria-hidden="true"><use href="#i-panel"/></svg>
        </button>
      </div>

      <nav class="main-nav" aria-label="主导航">
        <p class="nav-label">控制台</p>
        <button class="nav-item active" data-page="overview"><svg><use href="#i-grid"/></svg><span>运行总览</span></button>
        <button class="nav-item nav-flat-model" data-page="providers" hidden><svg><use href="#i-cpu"/></svg><span>可用模型</span></button>
        <div class="nav-group" data-nav-group="model-config">
          <button class="nav-item nav-parent" type="button" data-nav-toggle="model-config" aria-expanded="true">
            <svg><use href="#i-cpu"/></svg><span>模型配置</span><b class="nav-group-count">5</b>
            <i class="nav-caret" aria-hidden="true"></i>
          </button>
          <div class="nav-sub" role="group" aria-label="模型配置子菜单">
            <button class="nav-item nav-subitem" data-page="model-services"><span>模型服务配置</span></button>
            <button class="nav-item nav-subitem" data-page="model-sources"><span>源模型能力接入</span></button>
            <button class="nav-item nav-subitem" data-page="security-api"><span>签发 API Key</span></button>
          </div>
        </div>
        <button class="nav-item" data-page="routes"><svg><use href="#i-route"/></svg><span>业务路由</span></button>
        <p class="nav-label">组织与权限</p>
        <div class="nav-group" data-nav-group="identity">
          <button class="nav-item nav-parent" type="button" data-nav-toggle="identity" aria-expanded="true">
            <svg><use href="#i-users"/></svg><span>成员与权限</span>
            <i class="nav-caret" aria-hidden="true"></i>
          </button>
          <div class="nav-sub" role="group" aria-label="成员与权限子菜单">
            <button class="nav-item nav-subitem" data-page="members"><span>成员管理</span></button>
            <button class="nav-item nav-subitem" data-page="access"><span>角色权限</span></button>
          </div>
        </div>
        <p class="nav-label">分析中心</p>
        <div class="nav-group" data-nav-group="usage">
          <button class="nav-item nav-parent" type="button" data-nav-toggle="usage" aria-expanded="true">
            <svg><use href="#i-chart"/></svg><span>用量与费用</span>
            <i class="nav-caret" aria-hidden="true"></i>
          </button>
          <div class="nav-sub" role="group" aria-label="用量与费用子菜单">
            <button class="nav-item nav-subitem" data-page="usage"><span>用量概览</span></button>
            <button class="nav-item nav-subitem" data-page="usage-detail"><span>用量明细</span></button>
          </div>
        </div>
        <button class="nav-item" data-page="integration"><svg><use href="#i-log"/></svg><span>接入说明</span></button>
        <p class="nav-label">安全与合规</p>
        <button class="nav-item" data-page="security-policies"><svg><use href="#i-shield"/></svg><span>安全策略</span></button>
        <div class="nav-group" data-nav-group="audit">
          <button class="nav-item nav-parent" type="button" data-nav-toggle="audit" aria-expanded="true">
            <svg><use href="#i-log"/></svg><span>审计日志</span>
            <i class="nav-caret" aria-hidden="true"></i>
          </button>
          <div class="nav-sub" role="group" aria-label="审计日志子菜单">
            <button class="nav-item nav-subitem" data-page="audit-platform"><span>平台操作</span></button>
            <button class="nav-item nav-subitem" data-page="audit-policy"><span>策略命中</span></button>
            <button class="nav-item nav-subitem" data-page="audit-request"><span>调用日志</span></button>
          </div>
        </div>
        <button class="nav-item" data-page="alerts"><svg><use href="#i-bell"/></svg><span>告警规则</span></button>
        <p class="nav-label">智能体</p>
        <button class="nav-item" data-page="assistant"><svg><use href="#i-cpu"/></svg><span>助手配置</span></button>
      </nav>

      <div class="sidebar-foot">
        <div class="security-score"><div class="score-ring">96</div><div><strong>安全评分</strong><span>所有策略运行正常</span></div></div>
        <div class="workspace"><div class="avatar">康</div><div><strong>康师傅</strong><span>企业版 · 华东区</span></div><svg><use href="#i-arrow"/></svg></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="sidebar-toggle nav-reopen" type="button" data-sidebar-toggle="expand" aria-label="打开侧栏" title="打开侧栏" hidden>
            <svg aria-hidden="true"><use href="#i-panel-open"/></svg>
          </button>
          <div class="breadcrumb"><span>康师傅</span><i>/</i><span id="page-crumb"><strong>运行总览</strong></span></div>
        </div>
        <div class="top-actions">
          <label class="global-search"><svg><use href="#i-search"/></svg><input placeholder="搜索模型、路由或日志…"/><kbd>⌘ K</kbd></label>
          <button class="btn" type="button" data-x="assistant-toggle" id="x-assistant-toggle" title="打开右侧智能体边栏">智能体</button>
          <button class="icon-btn" aria-label="通知"><svg><use href="#i-bell"/></svg><i></i></button>
          <button class="role-switcher" id="role-switcher" type="button" aria-haspopup="menu" aria-expanded="false">
            <span class="user-avatar" id="role-avatar">GH</span>
            <span class="role-switcher-copy"><strong id="role-user-name">李晨</strong><small id="role-title">超级管理员</small></span>
            <svg aria-hidden="true"><use href="#i-arrow"/></svg>
          </button>
        </div>
      </header>

      <div id="page-content" class="page-content"></div>
    </main>

    <aside class="x-assistant-rail" id="x-assistant-rail" aria-hidden="true" aria-label="智能体对话">
      <div id="x-assistant-rail-content" class="x-assistant-rail-content"></div>
    </aside>
  </div>

  <div class="role-menu" id="role-menu" role="menu" aria-label="切换登录身份" hidden>
    <div class="role-menu-head"><strong>切换登录身份</strong><span>角色权限预览</span></div>
    <div id="role-menu-options"></div>
    <p class="role-menu-note">列表同步「成员管理」中已激活账号及其角色；权限范围取自「角色权限」配置。</p>
  </div>

  <div class="toast" id="toast"><span>已</span><div><strong>操作已完成</strong><small id="toast-text">配置已更新</small></div></div>
  <script src="./vendor/echarts.min.js"></script>
  <script src="./chart-components.js?v=20261118b"></script>
  <script src="./app.js?v=20261118b"></script>
  <script src="./interactions.js?v=20261118b"></script>
</body>
</html>
